[project]
name = "youtube-mcp"
version = "0.1.0"
description = "An mcp server for youtube video playback control and analytics via youtube data api, mpv player and claude desktop."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.193.0",
    "mcp==2.0.0",
    "pip>=26.2.1",
    "python-dotenv>=1.2.2",
    "python-mpv>=1.0.8",
    "youtube-transcript-api>=1.2.4",
]
